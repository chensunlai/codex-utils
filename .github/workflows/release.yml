name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...
      - name: Build release archives
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME#v}" dist
      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "codex-utils $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
